  log_dir: logs/fastconformer_hc6_s1234
  lr: 0.001
  lr_schedule: cosine
  max_amp_overflows: 0
  max_steps: 3000
  num_workers: 12
  reset_rng_after_init: true
  save_best: false
  save_every_eval: true
  save_last: false
  seed: 1234
  snapshot_weights_only: true
  stage: stage1_freeze_backbone
  use_amp: true
  warmup_steps: 500
