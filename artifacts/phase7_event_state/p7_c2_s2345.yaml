model:
  variant: E
  encoder:
    type: zipformer
    zipformer_dir: /home/edabk/hoangbpm/diar/diar_new/third_party/icefall/egs/librispeech/ASR/zipformer
    checkpoint: /home/edabk/hoangbpm/diar/diar_new/data_ext/models/icefall-asr-librispeech-streaming-zipformer-2023-05-17/exp/pretrained.pt
    causal: true
    chunk_size: '32'
    left_context_frames: '128'
    encoder_dim: 192,256,384,512,384,256
    downsampling_factor: 1,2,4,8,4,2
    num_encoder_layers: 2,2,3,4,3,2
    num_heads: 4,4,4,8,4,4
    feedforward_dim: 512,768,1024,1536,1024,768
    cnn_module_kernel: 31,31,15,15,15,31
    encoder_unmasked_dim: 192,192,256,256,256,192
    query_head_dim: 32
    value_head_dim: 12
    pos_head_dim: 4
    pos_dim: 48
    strict_load: false
    min_load_ratio: 0.9
    freeze_backbone: true
    unfreeze_last_n: 0
    multiscale: true
  head:
    type: tcn_state_ordinal
    d_model: 192
    dropout: 0.1
    event_stay_bias: 2.9
    state_emission_scale: 1.0
    event_filter_class_weights:
    - 12.0
    - 1.0
    - 12.0
    use_state_filter: true
  num_count_classes: 4
loss:
  count_loss_type: sord
  sord_alpha: 2.5
  class_weights:
  - 1.0
  - 1.0
  - 1.5
  - 3.0
  lambda_vad: 0.3
  lambda_overlap: 0.5
  lambda_emae: 0.2
  lambda_consistency: 0.2
  lambda_monotonic: 0.1
  lambda_dice: 0.5
  lambda_smooth: 0.02
  smooth_type: kl
  lambda_event: 0.2
  event_class_weights:
  - 12.0
  - 1.0
  - 12.0
  lambda_raw_anchor: 0.25
  lambda_boundary_smooth: 0.0
training:
  batch_size: 24
  lr: 3.0e-05
  lr_schedule: cosine
  warmup_steps: 500
  max_steps: 800
  grad_clip: 5.0
  use_amp: true
  eval_interval: 200
  eval_interval_early: 200
  early_phase_steps: 800
  num_workers: 12
  stage: stage3_finetune
  log_dir: logs/p7_c2_s2345
  freeze_backbone_all: false
  backbone_lr: 3.0e-05
  head_lr: 3.0e-05
  amp_init_scale: 4096.0
  amp_growth_interval: 2000
  seed: 2345
  save_every_eval: true
  snapshot_weights_only: true
  save_best: false
  save_last: true
  reset_rng_after_init: true
  init_backbone_only: false
  expected_init_missing:
  - head.event_proj.weight
  - head.event_proj.bias
  require_no_unexpected_init_keys: true
