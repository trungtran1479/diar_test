model:
  variant: E
  encoder:
    type: zipformer
    zipformer_dir: /home/edabk/hoangbpm/diar/diar_new/third_party/icefall/egs/librispeech/ASR/zipformer
    checkpoint: /home/edabk/hoangbpm/diar/diar_new/data_ext/models/icefall-asr-librispeech-streaming-zipformer-2023-05-17/exp/pretrained.pt
    causal: true
    chunk_size: '32'
    left_context_frames: '128'
    encoder_dim: 192,256,384,512,384,256
    downsampling_factor: 1,2,4,8,4,2
    num_encoder_layers: 2,2,3,4,3,2
    num_heads: 4,4,4,8,4,4
    feedforward_dim: 512,768,1024,1536,1024,768
    cnn_module_kernel: 31,31,15,15,15,31
    encoder_unmasked_dim: 192,192,256,256,256,192
    query_head_dim: 32
    value_head_dim: 12
    pos_head_dim: 4
    pos_dim: 48
    strict_load: false
    min_load_ratio: 0.9
    freeze_backbone: true
    unfreeze_last_n: 0
    multiscale: true
  head:
    type: tcn_ordinal
    d_model: 192
    dropout: 0.1
    stack_indices:
    - 0
  num_count_classes: 4
loss:
  count_loss_type: sord
  sord_alpha: 2.5
  class_weights:
  - 1.0
  - 1.0
  - 1.5
  - 3.0
  lambda_vad: 0.3
  lambda_overlap: 0.5
  lambda_emae: 0.2
  lambda_consistency: 0.2
  lambda_monotonic: 0.1
  lambda_dice: 0.5
  lambda_smooth: 0.02
  smooth_type: kl
  lambda_event: 0.0
  event_class_weights:
  - 12.0
  - 1.0
  - 12.0
  lambda_raw_anchor: 0.0
  lambda_boundary_smooth: 0.0
training:
  batch_size: 24
  lr: 0.001
  lr_schedule: cosine
  warmup_steps: 500
  max_steps: 3000
  grad_clip: 5.0
  use_amp: true
  eval_interval: 300
  eval_interval_early: 300
  early_phase_steps: 3000
  num_workers: 12
  stage: stage3_finetune
  log_dir: logs/probe_stack0_s1234
  seed: 1234
  freeze_backbone_all: true
  init_backbone_only: true
  reset_rng_after_init: true
  amp_init_scale: 4096.0
  max_amp_overflows: 0
  save_every_eval: true
